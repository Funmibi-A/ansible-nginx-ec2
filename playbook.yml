---
- name: Configure Nginx web server on EC2
  hosts: webservers
  become: true

  roles:
    - nginx

  post_tasks:
    - name: Verify the site responds from the control node
      ansible.builtin.uri:
        url: "http://{{ vault_ec2_public_ip }}"
        status_code: 200
      delegate_to: localhost
      become: false
      changed_when: false
